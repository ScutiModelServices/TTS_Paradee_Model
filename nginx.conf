# Load balancer in front of the tts_paradee_model replicas. Docker DNS gives `tts_paradee_model` one address per replica;
# nginx reads them at start, so restart this container after changing the replica count.
upstream tts_paradee_model {
    least_conn;
    server tts_paradee_model:29321 max_fails=2 fail_timeout=10s;
}

server {
    listen 29321;
    client_max_body_size 64k;

    location / {
        proxy_pass http://tts_paradee_model;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Internal-Token $http_x_internal_token;
        proxy_read_timeout 130s;
        # A speak call is a pure function of its body, so another replica may repeat it after a connection error.
        proxy_next_upstream error http_502 http_503;
        proxy_next_upstream_tries 2;
    }
}
